[package]
name = "adblocker"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Manage hosts-file ad blocking on macOS and Windows"
license = "MIT"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ureq = "3.5"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
thiserror = "2.0"
tempfile = "3.27"
ctrlc = { version = "3.5.2", features = ["termination"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
